name: Build Sihao QX source APK

on:
  push:
    branches:
      - build/sihao-qx-source-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test, lint and build main DiPlay APK
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :mobile:lintDebug :mobile:assembleDebug --stacktrace

      - name: Upload source-only APK
        uses: actions/upload-artifact@v4
        with:
          name: DiPlay-SihaoQX-source-only-debug-apk
          path: mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
